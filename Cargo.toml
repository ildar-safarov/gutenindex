[workspace]
members = [
    "index_io",
    "search",
    "indexer/rust/indexer",
    "indexer/rust/indexer-cli",
    "indexer/rust/tools",
    "search-cli",
    "web",
]
resolver = "2"

[workspace.package]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
zip = "2"
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18.4"
memmap2 = "0.9.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

index_io = { path = "index_io" }
search = { path = "search" }
indexer = { path = "indexer/rust/indexer" }
tools = { path = "indexer/rust/tools" }
